services:
  worker:
    build:
      context: ./backend
      args:
        INSTALL_ML: "true"
        INSTALL_VLLM: ${INSTALL_VLLM:-true}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-all}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
