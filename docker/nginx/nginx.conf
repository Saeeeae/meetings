server {
  listen 80;
  server_name _;

  # Must cover the backend's MAX_UPLOAD_SIZE_MB (default 2048); nginx's own
  # default of 1m would reject uploads with 413 before they reach the API.
  client_max_body_size 2g;

  location / {
    proxy_pass http://frontend:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (/api/jobs/{id}/events) must stream unbuffered; the backend sends a
    # heartbeat every 15s, so a 300s read timeout only cuts truly dead streams.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
